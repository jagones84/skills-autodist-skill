# ============================================================
# ESEMPIO eseguibile e autosufficiente.
#   store: examples/store   (2 skill demo finte)
#   output: examples/out/   (gitignorato; niente scritture in $HOME)
#
# Prova:   bash examples/run-demo.sh --dry-run
#          bash examples/run-demo.sh
#
# Ogni harness = un `type` (backend) + i suoi parametri:
#   flat         symlink piatti:            <skills_dir>/<skill>
#   categorized  symlink per categoria:     <skills_dir>/<store_cat>/<skill>
#   json_list    riscrive una lista in un file JSON (dichiarativo, no codice)
#   openclaw     preset: pool flat (skills_dir + library_dir) + liste per-agente
#
# Linguaggio: `cat:<nome>` = categoria intera; nome nudo = skill puntuale.
# `preserve: not_in_store` (default) tiene le voci non gestite dallo store;
# `preserve: none` riscrive la lista solo con le skill dello store.
# ============================================================
version: 2

store: examples/store

harnesses:

  # (1) directory piatta di skill
  demo-flat:
    type: flat
    skills_dir: examples/out/demo-flat
    skills: [cat:dev]

  # (2) layout per-categoria
  demo-categorized:
    type: categorized
    skills_dir: examples/out/demo-categorized
    skills: [cat:dev, cat:ops]

  # (3) harness che tiene le skill in un file JSON -> nessun codice richiesto.
  #     `pointer` = dot-path della lista; l'etichetta e' il penultimo segmento
  #     (…entries.<agent>.skills -> <agent>).
  demo-json-agent:
    type: json_list
    file: examples/out/demo-agent.json
    preserve: not_in_store
    backup: true
    lists:
      - pointer: agents.entries.coder.skills
        skills: [cat:dev]
      - pointer: agents.entries.ops.skills
        skills: [cat:ops]

  # (4) preset OpenClaw: pool condiviso + una lista per sub-agente
  demo-openclaw:
    type: openclaw
    skills_dir:  examples/out/demo-openclaw/pool
    library_dir: examples/out/demo-openclaw/library
    config:      examples/out/demo-openclaw.json
    preserve: not_in_store
    agents:
      coder: [cat:dev]
      coordinator: [cat:ops]
